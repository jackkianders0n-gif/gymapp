if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      // Re-check for a new version every time the app is opened or resumed —
      // iOS often resumes the same suspended page instead of reloading it, so
      // the browser's own update-on-load check alone doesn't catch that case.
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") reg.update().catch(function(){});
      });
    }).catch(function(){});
  });
  // Once a new service worker takes over, reload once so the page picks up
  // the matching fresh assets instead of running old JS against a new cache.
  var refreshedOnce = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (refreshedOnce) return;
    refreshedOnce = true;
    window.location.reload();
  });
}
</script>

// ─── Storage ───
// ─── Local-first storage: phone cache + Supabase sync ───
const ck = base => `pbcache_${base}_${currentUserId || "anon"}`;
function cacheRead() {
  const rd = (k, fb) => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch { return fb; } };
  return {
    exercises: rd(ck("ex"), null),
    workouts: rd(ck("wk"), []),
    ts: localStorage.getItem(ck("ts")) || null,
    dirty: localStorage.getItem(ck("dirty")) === "1",
  };
}
function cacheWrite(exercises, workouts, ts, dirty) {
  try {
    localStorage.setItem(ck("ex"), JSON.stringify(exercises));
    localStorage.setItem(ck("wk"), JSON.stringify(workouts));
    if (ts) localStorage.setItem(ck("ts"), ts);
    localStorage.setItem(ck("dirty"), dirty ? "1" : "0");
  } catch {}
}
function cacheClear() {
  ["ex", "wk", "ts", "dirty"].forEach(b => { try { localStorage.removeItem(ck(b)); } catch {} });
}
async function remoteRead() {
  if (!supa || !currentUserId) return null;
  try {
    const { data, error } = await supa.from("user_data").select("exercises,workouts,updated_at").eq("user_id", currentUserId).maybeSingle();
    if (error || !data) return null;
    return data;
  } catch { return null; }
}
async function remotePush(exercises, workouts, ts) {
  if (!supa || !currentUserId) return false;
  try {
    const { error } = await supa.from("user_data").upsert({ user_id: currentUserId, exercises, workouts, updated_at: ts }, { onConflict: "user_id" });
    return !error;
  } catch { return false; }
}

// ─── PB Tab ───
function PBTab({ exercises, onUpdate, onDelete }) {
  const [search, setSearch] = useState("");
  const [area, setArea] = useState("All");
  const [muscle, setMuscle] = useState("All");
  const [expanded, setExpanded] = useState(null);
  const [editing, setEditing] = useState(null); // exercise id

  const muscles = area !== "All" ? AREA_MUSCLES[area] : [];
  const filtered = exercises.filter(ex => {
    if (!ex.name.toLowerCase().includes(search.toLowerCase())) return false;
    if (area !== "All" && ex.area !== area) return false;
    if (muscle !== "All" && ex.muscle !== muscle) return false;
    return true;
  });
  const target = kg => kg + (kg >= 50 ? 2.5 : kg >= 20 ? 1.25 : 0.5);

  return (
    <div>
      <SearchBox value={search} onChange={setSearch} placeholder="Search exercises..." />
      <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: 8 }}>
        {["All", ...AREAS].map(a => {
          const active = area === a; const col = a === "All" ? "#888" : AREA_COLORS[a];
          return <button key={a} onClick={() => { setArea(a); setMuscle("All"); }} style={{ ...pillBase, ...(active ? pillActive(col) : pillInactive) }}>{a}</button>;
        })}
      </div>
      {muscles.length > 1 && (
        <div style={{ display: "flex", gap: 5, marginBottom: 10 }}>
          {["All", ...muscles].map(m => {
            const active = muscle === m; const col = AREA_COLORS[area];
            return <button key={m} onClick={() => setMuscle(m)} style={{ ...pillBase, borderRadius: 14, padding: "4px 10px", fontSize: 11, ...(active ? { background: `${col}15`, border: `1px solid ${col}40`, color: col } : { background: "transparent", border: "1px solid #222", color: "#555" }) }}>{m}</button>;
          })}
        </div>
      )}
      <div style={{ color: "#444", fontSize: 11, marginBottom: 8 }}>{filtered.length} exercises</div>

      {filtered.map(ex => {
        const isOpen = expanded === ex.id; const col = AREA_COLORS[ex.area];
        return (
          <div key={ex.id} style={{ background: "#1a1a1e", borderRadius: 10, marginBottom: 8, borderLeft: `3px solid ${col}`, overflow: "hidden" }}>
            <button onClick={() => setExpanded(isOpen ? null : ex.id)}
              style={{ width: "100%", background: "none", border: "none", padding: "12px 14px", cursor: "pointer", textAlign: "left", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ flex: 1 }}>
                <div style={{ color: "#eee", fontSize: 14, fontWeight: 600 }}>{ex.name}</div>
                <div style={{ color: "#666", fontSize: 11, marginTop: 2 }}>{ex.muscle}</div>
              </div>
              <div style={{ color: "#555", fontSize: 18, marginLeft: 8, transition: "transform 0.2s", transform: isOpen ? "rotate(180deg)" : "none" }}>⌄</div>
            </button>
            <div style={{ padding: "0 14px 10px", display: "flex", gap: 6, flexWrap: "wrap" }}>
              {[...ex.pbs].sort((a, b) => b.reps - a.reps).map(p => (
                <div key={p.reps} style={{ background: "#111", borderRadius: 6, padding: "5px 10px", textAlign: "center" }}>
                  <div style={{ color: "#999", fontSize: 10 }}>{p.reps} rep{p.reps > 1 ? "s" : ""}</div>
                  <div style={{ color: "#eee", fontSize: 15, fontWeight: 700 }}>{p.kg}<span style={{ color: "#666", fontSize: 11, fontWeight: 400 }}>kg</span></div>
                </div>
              ))}
            </div>
            {isOpen && (
              <div style={{ padding: "0 14px 14px" }}>
                <div style={{ background: "#111113", borderRadius: 8, padding: 10, marginBottom: 10 }}>
                  <div style={{ color: "#777", fontSize: 10, fontWeight: 600, marginBottom: 6, letterSpacing: "0.03em" }}>Targets to beat</div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {[...ex.pbs].sort((a, b) => b.reps - a.reps).map(p => (
                      <div key={p.reps} style={{ background: `${col}12`, border: `1px solid ${col}30`, borderRadius: 6, padding: "5px 10px", textAlign: "center", minWidth: 56 }}>
                        <div style={{ color: "#aaa", fontSize: 10 }}>{p.reps} reps</div>
                        <div style={{ color: col, fontSize: 14, fontWeight: 700 }}>{target(p.kg)}kg</div>
                      </div>
                    ))}
                  </div>
                </div>
                <div style={{ display: "flex", gap: 6 }}>
                  <button onClick={() => setEditing(ex.id)} style={{ flex: 1, background: "#131518", border: "1px solid #252830", borderRadius: 6, padding: "7px", color: "#8af", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>Edit</button>
                  <button onClick={() => { onDelete(ex.id); setExpanded(null); }} style={{ flex: 1, background: "#1c1215", border: "1px solid #3a1a1a", borderRadius: 6, padding: "7px", color: "#c44", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>Remove</button>
                </div>
              </div>
            )}
          </div>
        );
      })}

      {editing && <EditExerciseSheet exercise={exercises.find(e => e.id === editing)} onSave={updated => { onUpdate(updated); setEditing(null); }} onClose={() => setEditing(null)} />}
    </div>
  );
}

function EditExerciseSheet({ exercise, onSave, onClose }) {
  const [name, setName] = useState(exercise.name);
  const [area, setArea] = useState(exercise.area);
  const [muscle, setMuscle] = useState(exercise.muscle);
  const [pbs, setPbs] = useState(exercise.pbs.map(p => ({ reps: String(p.reps), kg: String(p.kg) })));

  const removePb = i => setPbs(prev => prev.filter((_, j) => j !== i));
  const updatePb = (i, field, val) => setPbs(prev => { const n = [...prev]; n[i] = { ...n[i], [field]: val }; return n; });
  const canSave = name.trim() && pbs.some(r => r.reps && r.kg);

  return (
    <Sheet title="Edit exercise" onClose={onClose}>
      <label style={{ color: "#888", fontSize: 11, display: "block", marginBottom: 4 }}>Name</label>
      <input value={name} onChange={e => setName(e.target.value)} style={{ ...inputStyle, width: "100%", boxSizing: "border-box", marginBottom: 12 }} />

      <label style={{ color: "#888", fontSize: 11, display: "block", marginBottom: 4 }}>Body area</label>
      <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: 10 }}>
        {AREAS.map(a => <button key={a} onClick={() => { setArea(a); setMuscle(AREA_MUSCLES[a][0]); }} style={{ ...pillBase, ...(area === a ? pillActive(AREA_COLORS[a]) : { ...pillInactive, background: "#111" }) }}>{a}</button>)}
      </div>

      <label style={{ color: "#888", fontSize: 11, display: "block", marginBottom: 4 }}>Muscle group</label>
      <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: 14 }}>
        {AREA_MUSCLES[area].map(m => <button key={m} onClick={() => setMuscle(m)} style={{ ...pillBase, borderRadius: 14, padding: "4px 10px", fontSize: 11, ...(muscle === m ? { background: `${AREA_COLORS[area]}15`, border: `1px solid ${AREA_COLORS[area]}40`, color: AREA_COLORS[area] } : { background: "#111", border: "1px solid #222", color: "#666" }) }}>{m}</button>)}
      </div>

      <label style={{ color: "#888", fontSize: 11, display: "block", marginBottom: 6 }}>PBs</label>
      {pbs.map((r, i) => (
        <div key={i} style={{ display: "flex", gap: 8, marginBottom: 6, alignItems: "center" }}>
          <input type="number" placeholder="Reps" value={r.reps} onChange={e => updatePb(i, "reps", e.target.value)} style={{ ...inputStyle, width: 65 }} />
          <span style={{ color: "#555", fontSize: 13 }}>×</span>
          <input type="number" placeholder="kg" value={r.kg} step="0.5" onChange={e => updatePb(i, "kg", e.target.value)} style={{ ...inputStyle, width: 75 }} />
          <span style={{ color: "#888", fontSize: 11 }}>kg</span>
          {pbs.length > 1 && <button onClick={() => removePb(i)} style={{ background: "none", border: "none", color: "#664", fontSize: 16, cursor: "pointer" }}>×</button>}
        </div>
      ))}
      <button onClick={() => setPbs([...pbs, { reps: "", kg: "" }])} style={{ background: "none", border: "1px dashed #333", borderRadius: 6, padding: "6px 12px", color: "#666", fontSize: 12, cursor: "pointer", fontFamily: "inherit", marginBottom: 16, width: "100%" }}>+ Add rep range</button>
      <button disabled={!canSave} onClick={() => {
        const cleaned = pbs.filter(r => r.reps && r.kg).map(r => ({ reps: Number(r.reps), kg: Number(r.kg) }));
        onSave({ ...exercise, name: name.trim(), area, muscle, pbs: cleaned });
      }} style={{ width: "100%", background: canSave ? "#3A9BE8" : "#222", border: "none", borderRadius: 8, padding: "12px", color: canSave ? "#fff" : "#555", fontSize: 14, fontWeight: 600, cursor: canSave ? "pointer" : "default", fontFamily: "inherit" }}>Save changes</button>
    </Sheet>
  );
}

// ─── Add Exercise Sheet ───

  const [area, setArea] = useState("Legs");
  const [muscle, setMuscle] = useState("Quads");
  const [pbs, setPbs] = useState([{ reps: "", kg: "" }]);
  const canSave = name.trim() && !existingNames.includes(name.trim()) && pbs.some(r => r.reps && r.kg);

  return (
    <Sheet title="Add exercise" onClose={onClose}>
      <label style={{ color: "#888", fontSize: 11, display: "block", marginBottom: 4 }}>Name</label>
      <input value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Leg Press" style={{ ...inputStyle, width: "100%", boxSizing: "border-box", marginBottom: 12 }} />
      <label style={{ color: "#888", fontSize: 11, display: "block", marginBottom: 4 }}>Body area</label>
      <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: 10 }}>
        {AREAS.map(a => <button key={a} onClick={() => { setArea(a); setMuscle(AREA_MUSCLES[a][0]); }} style={{ ...pillBase, ...(area === a ? pillActive(AREA_COLORS[a]) : { ...pillInactive, background: "#111" }) }}>{a}</button>)}
      </div>
      <label style={{ color: "#888", fontSize: 11, display: "block", marginBottom: 4 }}>Muscle group</label>
      <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: 14 }}>
        {AREA_MUSCLES[area].map(m => <button key={m} onClick={() => setMuscle(m)} style={{ ...pillBase, borderRadius: 14, padding: "4px 10px", fontSize: 11, ...(muscle === m ? { background: `${AREA_COLORS[area]}15`, border: `1px solid ${AREA_COLORS[area]}40`, color: AREA_COLORS[area] } : { background: "#111", border: "1px solid #222", color: "#666" }) }}>{m}</button>)}
      </div>
      <label style={{ color: "#888", fontSize: 11, display: "block", marginBottom: 6 }}>PBs</label>

        <div key={i} style={{ display: "flex", gap: 8, marginBottom: 6, alignItems: "center" }}>
          <input type="number" placeholder="Reps" value={r.reps} onChange={e => { const n = [...pbs]; n[i].reps = e.target.value; setPbs(n); }} style={{ ...inputStyle, width: 65 }} />
          <span style={{ color: "#555" }}>×</span>
          <input type="number" placeholder="kg" value={r.kg} step="0.5" onChange={e => { const n = [...pbs]; n[i].kg = e.target.value; setPbs(n); }} style={{ ...inputStyle, width: 75 }} />
          <span style={{ color: "#888", fontSize: 11 }}>kg</span>
          {pbs.length > 1 && <button onClick={() => setPbs(pbs.filter((_, j) => j !== i))} style={{ background: "none", border: "none", color: "#664", fontSize: 16, cursor: "pointer" }}>×</button>}
        </div>
      ))}
      <button onClick={() => setPbs([...pbs, { reps: "", kg: "" }])} style={{ background: "none", border: "1px dashed #333", borderRadius: 6, padding: "6px 12px", color: "#666", fontSize: 12, cursor: "pointer", fontFamily: "inherit", marginBottom: 16, width: "100%" }}>+ Add rep range</button>
      <button disabled={!canSave} onClick={() => {
        const cleaned = pbs.filter(r => r.reps && r.kg).map(r => ({ reps: Number(r.reps), kg: Number(r.kg) }));
        onAdd({ id: uid(), name: name.trim(), area, muscle, pbs: cleaned });
      }} style={{ width: "100%", background: canSave ? "#3A9BE8" : "#222", border: "none", borderRadius: 8, padding: "12px", color: canSave ? "#fff" : "#555", fontSize: 14, fontWeight: 600, cursor: canSave ? "pointer" : "default", fontFamily: "inherit" }}>Save exercise</button>
    </Sheet>
  );
}

// ─── Log Workout ───
function LogWorkout({ exercises, onSave, onCancel, prefill, editMode }) {
  const [name, setName] = useState(prefill?.name || "");
  const [search, setSearch] = useState("");
  const [items, setItems] = useState(() => {
    if (prefill) return prefill.exercises.map(ex => ({ name: ex.name, exerciseId: ex.exerciseId, sets: ex.sets.map(s => ({ reps: String(s.reps), kg: String(s.kg) })) }));
    return [];
  });

  const q = search.trim().toLowerCase();
  const available = exercises.filter(e =>
    (e.name.toLowerCase().includes(q) || e.area.toLowerCase().includes(q) || e.muscle.toLowerCase().includes(q))
    && !items.find(s => s.name === e.name));
  const addEx = ex => {
    // One PB: seed it directly. Multiple: leave sets empty so the rep chooser shows. None: one blank set.
    let seedSets;
    if (ex.pbs.length === 1) seedSets = [{ reps: String(ex.pbs[0].reps), kg: String(ex.pbs[0].kg) }];
    else if (ex.pbs.length === 0) seedSets = [{ reps: "", kg: "" }];
    else seedSets = [];
    setItems(prev => [...prev, { name: ex.name, exerciseId: ex.id, sets: seedSets }]);
    setSearch("");
  };
  const chooseRep = (ei, pb) => setItems(prev => prev.map((e, i) => i === ei ? { ...e, sets: [{ reps: String(pb.reps), kg: String(pb.kg) }] } : e));
  const removeEx = i => setItems(prev => prev.filter((_, j) => j !== i));
  const moveEx = (i, dir) => { setItems(prev => { const n = [...prev]; const t = n[i]; n[i] = n[i + dir]; n[i + dir] = t; return n; }); };
  const updateSet = (ei, si, f, v) => setItems(prev => { const n = prev.map((e, i) => i === ei ? { ...e, sets: e.sets.map((s, j) => j === si ? { ...s, [f]: v } : s) } : e); return n; });
  // New set copies the previous one
  const addSet = ei => setItems(prev => prev.map((e, i) => {
    if (i !== ei) return e;
    const last = e.sets[e.sets.length - 1] || { reps: "", kg: "" };
    return { ...e, sets: [...e.sets, { ...last }] };
  }));
  const removeSet = (ei, si) => setItems(prev => prev.map((e, i) => i === ei ? { ...e, sets: e.sets.filter((_, j) => j !== si) } : e));
  const canSave = items.length > 0 && items.every(ex => ex.sets.some(s => s.reps && s.kg));

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <span style={{ color: "#eee", fontSize: 16, fontWeight: 600 }}>{editMode ? "Edit workout" : prefill ? "Repeat workout" : "Log workout"}</span>
        <button onClick={onCancel} style={{ background: "none", border: "1px solid #2a2a2e", borderRadius: 6, padding: "5px 12px", color: "#888", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>Cancel</button>
      </div>

      <input type="text" placeholder="Workout name (optional), e.g. Push Day" value={name} onChange={e => setName(e.target.value)}
        style={{ ...inputStyle, width: "100%", boxSizing: "border-box", marginBottom: 12 }} />

      {items.map((ex, ei) => {
        const exData = exercises.find(e => e.id === ex.exerciseId) || exercises.find(e => e.name === ex.name);
        const col = exData ? AREA_COLORS[exData.area] : "#888";
        return (
          <div key={ex.name} style={{ background: "#1a1a1e", borderRadius: 10, borderLeft: `3px solid ${col}`, marginBottom: 8, padding: "12px 14px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <div style={{ flex: 1 }}>
                <div style={{ color: "#eee", fontSize: 13, fontWeight: 600 }}>{ex.name}</div>
                {exData && <div style={{ color: "#555", fontSize: 10, marginTop: 1 }}>PB: {exData.pbs.map(p => `${p.reps}×${p.kg}kg`).join(" · ")}</div>}
              </div>
              <div style={{ display: "flex", gap: 2, alignItems: "center" }}>
                {ei > 0 && <button onClick={() => moveEx(ei, -1)} style={{ background: "none", border: "none", color: "#555", fontSize: 16, cursor: "pointer", padding: "2px 5px" }}>↑</button>}
                {ei < items.length - 1 && <button onClick={() => moveEx(ei, 1)} style={{ background: "none", border: "none", color: "#555", fontSize: 16, cursor: "pointer", padding: "2px 5px" }}>↓</button>}
                <button onClick={() => removeEx(ei)} style={{ background: "none", border: "none", color: "#664", fontSize: 18, cursor: "pointer", padding: "2px 5px" }}>×</button>
              </div>
            </div>
            {ex.sets.length === 0 ? (
              <div>
                <div style={{ color: "#888", fontSize: 11, marginBottom: 7 }}>How many reps today?</div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  {exData && [...exData.pbs].sort((a, b) => b.reps - a.reps).map(p => (
                    <button key={p.reps} onClick={() => chooseRep(ei, p)}
                      style={{ background: `${col}15`, border: `1px solid ${col}40`, borderRadius: 8, padding: "8px 12px", cursor: "pointer", fontFamily: "inherit", textAlign: "center" }}>
                      <div style={{ color: col, fontSize: 14, fontWeight: 700 }}>{p.reps} reps</div>
                      <div style={{ color: "#999", fontSize: 11 }}>{p.kg}kg PB</div>
                    </button>
                  ))}
                </div>
              </div>
            ) : (
              <>
                {ex.sets.map((s, si) => (
                  <div key={si} style={{ display: "flex", gap: 6, marginBottom: 5, alignItems: "center" }}>
                    <span style={{ color: "#555", fontSize: 11, width: 28 }}>S{si + 1}</span>
                    <input type="number" placeholder="Reps" value={s.reps} onChange={e => updateSet(ei, si, "reps", e.target.value)} style={{ ...inputStyle, width: 58 }} />
                    <span style={{ color: "#555", fontSize: 12 }}>×</span>
                    <input type="number" placeholder="kg" value={s.kg} step="0.5" onChange={e => updateSet(ei, si, "kg", e.target.value)} style={{ ...inputStyle, width: 68 }} />
                    <span style={{ color: "#888", fontSize: 11 }}>kg</span>
                    {ex.sets.length > 1 && <button onClick={() => removeSet(ei, si)} style={{ background: "none", border: "none", color: "#553", fontSize: 14, cursor: "pointer" }}>×</button>}
                  </div>
                ))}
                <button onClick={() => addSet(ei)} style={{ background: "none", border: "1px dashed #2a2a2e", borderRadius: 6, padding: "4px 10px", color: "#555", fontSize: 11, cursor: "pointer", fontFamily: "inherit", marginTop: 2 }}>+ Set</button>
              </>
            )}
          </div>
        );
      })}

      <div style={{ position: "relative", marginTop: 4, marginBottom: 6 }}>
        <div style={{ position: "absolute", left: 11, top: "50%", transform: "translateY(-50%)" }}><SvgSearch /></div>
        <input type="text" placeholder="Add by name, area, or muscle..." value={search} onChange={e => setSearch(e.target.value)}
          style={{ width: "100%", boxSizing: "border-box", background: "#111", border: "1px solid #2a2a2e", borderRadius: 8, padding: "10px 12px 10px 34px", color: "#eee", fontSize: 13, outline: "none", fontFamily: "inherit" }} />
      </div>
      {search && (
        <div style={{ background: "#151517", borderRadius: 8, marginBottom: 10, maxHeight: 260, overflow: "auto" }}>
          {available.length === 0 && <div style={{ color: "#555", padding: "10px 14px", fontSize: 12 }}>No matches</div>}
          {available.slice(0, 30).map(ex => (
            <button key={ex.name} onClick={() => addEx(ex)}
              style={{ width: "100%", background: "none", border: "none", borderBottom: "1px solid #1a1a1e", padding: "10px 14px", cursor: "pointer", textAlign: "left", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div><div style={{ color: "#ddd", fontSize: 13 }}>{ex.name}</div><div style={{ color: "#555", fontSize: 10 }}>{ex.area} · {ex.muscle}</div></div>
              <span style={{ color: "#3A9BE8", fontSize: 18 }}>+</span>
            </button>
          ))}
        </div>
      )}
      <button onClick={() => {
        const workout = { id: uid(), date: new Date().toISOString(), name: name.trim() || null, exercises: items.map(ex => ({ name: ex.name, exerciseId: ex.exerciseId, sets: ex.sets.filter(s => s.reps && s.kg).map(s => ({ reps: Number(s.reps), kg: Number(s.kg) })) })).filter(ex => ex.sets.length > 0) };
        onSave(workout);
      }} disabled={!canSave}
        style={{ width: "100%", background: canSave ? "#3A9BE8" : "#222", border: "none", borderRadius: 8, padding: "12px", color: canSave ? "#fff" : "#555", fontSize: 14, fontWeight: 600, cursor: canSave ? "pointer" : "default", fontFamily: "inherit", marginTop: 8 }}>
        {editMode ? "Save changes" : "Save workout"}
      </button>
    </div>
  );
}

// ─── Workouts Tab ───
function WorkoutsTab({ exercises, workouts, onSaveWorkout, onEditWorkout, onDeleteWorkout }) {
  const [logging, setLogging] = useState(false);
  const [prefill, setPrefill] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [openId, setOpenId] = useState(null);

  const fmt = d => new Date(d).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
  const ago = d => { const days = Math.floor((new Date() - new Date(d)) / 86400000); if (days === 0) return "Today"; if (days === 1) return "Yesterday"; return `${days}d ago`; };
  const recent4 = workouts.slice(0, 4);

  const closeLog = () => { setLogging(false); setPrefill(null); setEditingId(null); };

  if (logging) {
    return <LogWorkout exercises={exercises} prefill={prefill} editMode={!!editingId}
      onSave={w => { if (editingId) onEditWorkout(editingId, { name: w.name, exercises: w.exercises }); else onSaveWorkout(w); closeLog(); }}
      onCancel={closeLog} />;
  }

  return (
    <div>
      <button onClick={() => setLogging(true)}
        style={{ width: "100%", background: "#3A9BE8", border: "none", borderRadius: 8, padding: "12px", color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", marginBottom: 10 }}>
        Log workout
      </button>

      {recent4.length > 0 && (
        <div style={{ marginBottom: 14 }}>
          <div style={{ color: "#777", fontSize: 11, marginBottom: 6, fontWeight: 500 }}>Repeat a recent session</div>
          <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 4, WebkitOverflowScrolling: "touch" }}>
            {recent4.map((w, i) => (
              <button key={w.id} onClick={() => { setPrefill(w); setLogging(true); }}
                style={{ background: "#1a1a1e", border: "1px solid #2a2a2e", borderRadius: 8, padding: "8px 12px", cursor: "pointer", flexShrink: 0, textAlign: "left", minWidth: 110 }}>
                <div style={{ color: "#ccc", fontSize: 12, fontWeight: 500 }}>{w.name || fmt(w.date)}</div>
                <div style={{ color: "#666", fontSize: 10, marginTop: 2 }}>{w.name ? fmt(w.date) : `${w.exercises.length} exercises`}</div>
              </button>
            ))}
          </div>
        </div>
      )}

      {workouts.length === 0 && <div style={{ color: "#555", textAlign: "center", padding: 40, fontSize: 13 }}>No workouts logged yet</div>}

      {workouts.map(w => (
        <div key={w.id} style={{ background: "#1a1a1e", borderRadius: 10, marginBottom: 8, overflow: "hidden" }}>
          <button onClick={() => setOpenId(openId === w.id ? null : w.id)}
            style={{ width: "100%", background: "none", border: "none", padding: "12px 14px", cursor: "pointer", textAlign: "left", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ color: "#eee", fontSize: 14, fontWeight: 600 }}>{w.name || fmt(w.date)}</div>
              <div style={{ color: "#666", fontSize: 11 }}>{w.name ? `${fmt(w.date)} · ` : ""}{w.exercises.map(e => e.name).join(", ").slice(0, 50)}{w.exercises.map(e => e.name).join(", ").length > 50 ? "…" : ""}</div>
            </div>
            <div style={{ textAlign: "right", flexShrink: 0, marginLeft: 8 }}>
              <div style={{ color: "#888", fontSize: 12 }}>{ago(w.date)}</div>
              <div style={{ color: "#555", fontSize: 11 }}>{w.exercises.length} exercises</div>
            </div>
          </button>
          {openId === w.id && (
            <div style={{ padding: "0 14px 14px" }}>
              {w.exercises.map((ex, i) => {
                const exData = exercises.find(e => e.id === ex.exerciseId) || exercises.find(e => e.name === ex.name);
                return (
                  <div key={i} style={{ background: "#111", borderRadius: 6, padding: "8px 10px", marginBottom: 4 }}>
                    <div style={{ color: "#ccc", fontSize: 13, fontWeight: 500, marginBottom: 3 }}>{ex.name}</div>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                      {ex.sets.map((s, j) => {
                        const pb = exData?.pbs.find(p => p.reps === s.reps);
                        const isPB = pb && s.kg >= pb.kg;
                        return <span key={j} style={{ color: isPB ? "#E8B931" : "#888", fontSize: 12, fontWeight: isPB ? 700 : 400 }}>{s.reps}×{s.kg}kg{isPB ? " 🏆" : ""}{j < ex.sets.length - 1 ? "  ·" : ""}</span>;
                      })}
                    </div>
                  </div>
                );
              })}
              <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                <button onClick={() => { setPrefill(w); setEditingId(w.id); setLogging(true); }}
                  style={{ flex: 1, background: "#131518", border: "1px solid #252830", borderRadius: 6, padding: "7px", color: "#8af", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>
                  Edit workout
                </button>
                <button onClick={() => onDeleteWorkout(w.id)}
                  style={{ flex: 1, background: "#1c1215", border: "1px solid #3a1a1a", borderRadius: 6, padding: "7px", color: "#c44", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>
                  Delete workout
                </button>
              </div>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

// ─── Progress Tab ───
function ProgressTab({ exercises, workouts }) {
  const [selected, setSelected] = useState(exercises[0]?.name || "");
  const [searchP, setSearchP] = useState("");
  const ex = exercises.find(e => e.name === selected);
  const col = ex ? AREA_COLORS[ex.area] : "#888";
  const searchResults = exercises.filter(e => e.name.toLowerCase().includes(searchP.toLowerCase()));

  // Build real chart data from workouts
  const chartData = useMemo(() => {
    if (!ex) return [];
    const twoMonthsAgo = new Date(); twoMonthsAgo.setMonth(twoMonthsAgo.getMonth() - 2);
    const repMap = {};
    workouts.filter(w => new Date(w.date) >= twoMonthsAgo).sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(w => {
      const wex = w.exercises.find(e => e.exerciseId === ex.id) || w.exercises.find(e => e.name === ex.name);
      if (!wex) return;
      wex.sets.forEach(s => {
        if (!repMap[s.reps]) repMap[s.reps] = [];
        const dateStr = new Date(w.date).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
        const existing = repMap[s.reps].find(p => p.date === dateStr);
        if (existing) { if (s.kg > existing.kg) existing.kg = s.kg; }
        else repMap[s.reps].push({ date: dateStr, kg: s.kg });
      });
    });
    return Object.entries(repMap).sort(([a], [b]) => Number(b) - Number(a)).map(([reps, history]) => ({ reps: Number(reps), history }));
  }, [selected, workouts]);

  const hasData = chartData.length > 0;

  return (
    <div>
      <SearchBox value={searchP} onChange={setSearchP} placeholder="Find exercise..." />
      <div style={{ display: "flex", gap: 5, overflowX: "auto", paddingBottom: 8, marginBottom: 12, WebkitOverflowScrolling: "touch" }}>
        {searchResults.map(e => {
          const active = selected === e.name; const c = AREA_COLORS[e.area];
          return <button key={e.name} onClick={() => { setSelected(e.name); setSearchP(""); }}
            style={{ background: active ? `${c}20` : "#1a1a1e", border: `1px solid ${active ? `${c}50` : "#2a2a2e"}`, borderRadius: 8, padding: "6px 12px", color: active ? c : "#888", fontSize: 12, cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap", flexShrink: 0 }}>
            {e.name}

          {!hasData && (
            <div style={{ color: "#555", textAlign: "center", padding: "30px 20px", fontSize: 13, background: "#1a1a1e", borderRadius: 10 }}>
              No workout data yet for this exercise. Log a workout to see progress here.
            </div>
          )}
          {chartData.map(h => (
            <div key={h.reps} style={{ background: "#1a1a1e", borderRadius: 10, padding: "12px 10px", marginBottom: 10 }}>
              <div style={{ color: "#999", fontSize: 12, marginBottom: 6, fontWeight: 500 }}>
                {h.reps}-rep max
                <span style={{ color: col, fontWeight: 700, marginLeft: 8 }}>{h.history[h.history.length - 1]?.kg}kg</span>
              </div>
              <ResponsiveContainer width="100%" height={120}>
                <LineChart data={h.history} margin={{ top: 4, right: 4, bottom: 0, left: -24 }}>
                  <XAxis dataKey="date" tick={{ fill: "#555", fontSize: 9 }} axisLine={false} tickLine={false} interval="preserveStartEnd" />
                  <YAxis tick={{ fill: "#555", fontSize: 10 }} axisLine={false} tickLine={false} domain={["dataMin - 5", "dataMax + 5"]} />
                  <Tooltip contentStyle={{ background: "#222", border: "none", borderRadius: 6, fontSize: 12, color: "#eee" }} labelStyle={{ color: "#888" }} />
                  <Line type="monotone" dataKey="kg" stroke={col} strokeWidth={2} dot={{ r: 3, fill: col }} activeDot={{ r: 5 }} />
                </LineChart>
              </ResponsiveContainer>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

        <div style={{ color: "#E8B931", fontSize: 26, fontWeight: 800, letterSpacing: "-0.02em", marginBottom: 4, animation: "pbGlow 1.8s ease-in-out infinite", fontFamily: "'Inter', system-ui, sans-serif" }}>
          {single ? "New PB!" : `${pbs.length} New PBs!`}
        </div>
        <div style={{ color: "#aaa", fontSize: 13, marginBottom: 16, fontFamily: "'Inter', system-ui, sans-serif" }}>Nice work 💪</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {pbs.slice(0, 5).map((p, i) => (
            <div key={i} style={{ background: "rgba(232,185,49,0.1)", border: "1px solid rgba(232,185,49,0.3)", borderRadius: 8, padding: "8px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", animation: `pbRowIn 0.4s ${0.3 + i * 0.1}s both`, fontFamily: "'Inter', system-ui, sans-serif" }}>
              <span style={{ color: "#eee", fontSize: 13, fontWeight: 500 }}>{p.name}</span>
              <span style={{ color: "#E8B931", fontSize: 13, fontWeight: 700 }}>
                {p.reps}×{p.kg}kg{p.prev != null ? <span style={{ color: "#777", fontWeight: 400 }}>  (was {p.prev})</span> : <span style={{ color: "#777", fontWeight: 400 }}>  (new rep max)</span>}
              </span>
            </div>
          ))}
        </div>

// Recompute an exercise's PBs after a workout is deleted — only lowers a PB when
// remaining workout history no longer justifies it. If no remaining workout says
// anything about that rep count, the PB is left untouched (it may be a manually
// entered baseline with no workout backing it at all).
function recomputePBsAfterDelete(exercises, remainingWorkouts, deletedWorkout) {
  return exercises.map(ex => {
    const matches = wex => wex.exerciseId === ex.id || wex.name === ex.name;
    const deletedWex = deletedWorkout.exercises.find(matches);
    if (!deletedWex) return ex;
    let pbs = ex.pbs;
    const repsAffected = new Set(deletedWex.sets.map(s => s.reps));
    repsAffected.forEach(reps => {
      const pbIdx = pbs.findIndex(p => p.reps === reps);
      if (pbIdx === -1) return;
      let best = null;
      remainingWorkouts.forEach(w => {
        w.exercises.filter(matches).forEach(wex => {
          wex.sets.forEach(s => { if (s.reps === reps && (best === null || s.kg > best)) best = s.kg; });
        });
      });
      if (best !== null && best < pbs[pbIdx].kg) {
        pbs = pbs.map((p, i) => i === pbIdx ? { ...p, kg: best } : p);
      }
    });
    return pbs === ex.pbs ? ex : { ...ex, pbs };
  });
}

// ─── App ───
const TABS = ["PBs", "Workouts", "Progress"];

function MainApp({ onSignOut }) {
  const [exercises, setExercises] = useState(SEED_JAKEY);
  const [workouts, setWorkouts] = useState([]);
  const [tab, setTab] = useState("PBs");
  const [showAdd, setShowAdd] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [needsStarter, setNeedsStarter] = useState(false); // brand-new account: show starter chooser
  const [celebration, setCelebration] = useState(null); // array of beaten PBs
  const [sync, setSync] = useState("syncing"); // "synced" | "syncing" | "offline"
  const bootRef = useRef(false);
  const readyRef = useRef(false); // becomes true after first reconcile — gates pushes

  // Boot: show cached data instantly (works offline), then reconcile with the cloud.
  // A brand-new account (no local cache AND no remote row) sees a one-time starter chooser instead.
  useEffect(() => {
    if (bootRef.current) return; bootRef.current = true;
    const c = cacheRead();

    if (c.exercises) {
      // Returning user on this device — load cached data instantly, then reconcile with the cloud.
      setExercises(c.exercises);
      if (c.workouts) setWorkouts(c.workouts);
      setLoaded(true);

      (async () => {
        if (!navigator.onLine) { setSync("offline"); readyRef.current = true; return; }
        setSync("syncing");
        const remote = await remoteRead();
        const remoteWins = remote && (!c.ts || (!c.dirty && new Date(remote.updated_at) >= new Date(c.ts)));
        if (remoteWins) {
          if (remote.exercises) setExercises(remote.exercises);
          setWorkouts(remote.workouts || []);
          cacheWrite(remote.exercises || c.exercises, remote.workouts || [], remote.updated_at, false);
          setSync("synced");
        } else {
          const ts = c.ts || new Date().toISOString();
          const ok = await remotePush(c.exercises, c.workouts, ts);
          cacheWrite(c.exercises, c.workouts, ts, !ok);
          setSync(ok ? "synced" : "offline");
        }
        readyRef.current = true;
      })();
      return;
    }

    // No local cache. Could be a returning user on a new device (remote has data — skip the
    // chooser) or a brand-new account (no remote row — show the chooser).
    (async () => {
      if (!navigator.onLine) {
        // Can't check the cloud right now; fall back to the default seed rather than guess.
        setExercises(SEED_JAKEY);
        setLoaded(true);
        setSync("offline");
        readyRef.current = true;
        return;
      }
      setSync("syncing");
      const remote = await remoteRead();
      if (remote && remote.exercises) {
        setExercises(remote.exercises);
        setWorkouts(remote.workouts || []);
        cacheWrite(remote.exercises, remote.workouts || [], remote.updated_at, false);
        setSync("synced");
        setLoaded(true);
        readyRef.current = true;
      } else {
        setNeedsStarter(true);
        setLoaded(true);
      }
    })();
  }, []);

  const handleChooseStarter = useCallback(key => {
    const seed = key === "jakey" ? SEED_JAKEY : key === "jack" ? SEED_JACK : [];
    readyRef.current = true;
    setNeedsStarter(false);
    setExercises(seed);
    setWorkouts([]);
  }, []);

  // On change: save to phone immediately, then push to cloud if online
  useEffect(() => {
    if (!loaded || !readyRef.current) return;
    const ts = new Date().toISOString();
    cacheWrite(exercises, workouts, ts, true);
    (async () => {
      if (!navigator.onLine) { setSync("offline"); return; }
      setSync("syncing");
      const ok = await remotePush(exercises, workouts, ts);
      if (ok) { try { localStorage.setItem(ck("dirty"), "0"); } catch {} setSync("synced"); }
      else setSync("offline");
    })();
  }, [exercises, workouts, loaded]);

  // Flush queued changes when the connection returns
  useEffect(() => {
    const onOnline = async () => {
      const c = cacheRead();
      if (c.dirty) {
        setSync("syncing");
        const ok = await remotePush(c.exercises, c.workouts, c.ts || new Date().toISOString());
        if (ok) { try { localStorage.setItem(ck("dirty"), "0"); } catch {} setSync("synced"); }
        else setSync("offline");
      } else setSync("synced");
    };
    const onOffline = () => setSync("offline");
    window.addEventListener("online", onOnline);
    window.addEventListener("offline", onOffline);
    return () => { window.removeEventListener("online", onOnline); window.removeEventListener("offline", onOffline); };
  }, []);

  const syncMeta = sync === "offline"
    ? { color: "#E8B931", label: "Offline · saved on device" }
    : sync === "syncing"
    ? { color: "#666", label: "Syncing…" }
    : { color: "#3AE89B", label: "Synced" };

  const handleDelete = useCallback(id => setExercises(prev => prev.filter(e => e.id !== id)), []);
  const handleUpdate = useCallback(updated => setExercises(prev => prev.map(e => e.id === updated.id ? updated : e)), []);
  const handleAdd = useCallback(ex => { setExercises(prev => [...prev, ex].sort((a, b) => a.name.localeCompare(b.name))); setShowAdd(false); }, []);

  const handleSaveWorkout = useCallback(w => {
    setWorkouts(prev => [w, ...prev]);
    const beaten = []; // { name, reps, kg, prev }
    // Auto-update PBs
    setExercises(prev => {
      const updated = prev.map(e => ({ ...e, pbs: [...e.pbs] }));
      w.exercises.forEach(wex => {
        const idx = updated.findIndex(e => e.id === wex.exerciseId || e.name === wex.name);
        if (idx === -1) return;
        // For each rep count, only the best set of the session counts
        const bestByReps = {};
        wex.sets.forEach(s => { if (!bestByReps[s.reps] || s.kg > bestByReps[s.reps]) bestByReps[s.reps] = s.kg; });
        Object.entries(bestByReps).forEach(([reps, kg]) => {
          reps = Number(reps);
          const pbIdx = updated[idx].pbs.findIndex(p => p.reps === reps);
          if (pbIdx >= 0) {
            if (kg > updated[idx].pbs[pbIdx].kg) {
              beaten.push({ name: wex.name, reps, kg, prev: `${updated[idx].pbs[pbIdx].kg}kg` });
              updated[idx].pbs[pbIdx] = { ...updated[idx].pbs[pbIdx], kg };
            }
          } else {
            beaten.push({ name: wex.name, reps, kg, prev: null });
            updated[idx].pbs.push({ reps, kg });
          }
        });
      });
      return updated;
    });
    if (beaten.length) setCelebration(beaten);
  }, []);

  const handleDeleteWorkout = useCallback(id => {
    setWorkouts(prev => {
      const deleted = prev.find(w => w.id === id);
      const remaining = prev.filter(w => w.id !== id);
      if (deleted) setExercises(prevEx => recomputePBsAfterDelete(prevEx, remaining, deleted));
      return remaining;
    });
  }, []);

  const handleEditWorkout = useCallback((id, changes) => {
    setWorkouts(prev => {
      const old = prev.find(w => w.id === id);
      if (!old) return prev;
      const updatedWorkout = { ...old, ...changes };
      const remaining = prev.filter(w => w.id !== id);

      setExercises(prevEx => {
        // First undo the old version's effect on PBs, same as a delete...
        const afterRemoval = recomputePBsAfterDelete(prevEx, remaining, old);
        // ...then reapply as if the edited version was just logged, tracking any new PBs.
        const updated = afterRemoval.map(e => ({ ...e, pbs: [...e.pbs] }));
        const beaten = [];
        updatedWorkout.exercises.forEach(wex => {
          const idx = updated.findIndex(e => e.id === wex.exerciseId || e.name === wex.name);
          if (idx === -1) return;
          const bestByReps = {};
          wex.sets.forEach(s => { if (!bestByReps[s.reps] || s.kg > bestByReps[s.reps]) bestByReps[s.reps] = s.kg; });
          Object.entries(bestByReps).forEach(([reps, kg]) => {
            reps = Number(reps);
            const pbIdx = updated[idx].pbs.findIndex(p => p.reps === reps);
            if (pbIdx >= 0) {
              if (kg > updated[idx].pbs[pbIdx].kg) {
                beaten.push({ name: wex.name, reps, kg, prev: `${updated[idx].pbs[pbIdx].kg}kg` });
                updated[idx].pbs[pbIdx] = { ...updated[idx].pbs[pbIdx], kg };
              }
            } else {
              beaten.push({ name: wex.name, reps, kg, prev: null });
              updated[idx].pbs.push({ reps, kg });
            }
          });
        });
        if (beaten.length) setCelebration(beaten);
        return updated;
      });

      return prev.map(w => w.id === id ? updatedWorkout : w);
    });
  }, []);

  if (!loaded) return <div style={{ background: "#0e0e10", minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}><div style={{ color: "#555", fontSize: 14 }}>Loading...</div></div>;
  if (needsStarter) return <StarterChooser onChoose={handleChooseStarter} />;

  return (
    <div style={{ background: "#0e0e10", minHeight: "100vh", fontFamily: "'Inter', system-ui, sans-serif", maxWidth: 480, margin: "0 auto" }}>
      <div style={{ padding: "16px 16px 0", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <h1 style={{ color: "#f0f0f0", fontSize: 22, fontWeight: 700, margin: 0, letterSpacing: "-0.03em" }}>Gym Tracker</h1>
          <div style={{ display: "flex", alignItems: "center", gap: 5, marginTop: 3 }}>
            <span style={{ width: 6, height: 6, borderRadius: 3, background: syncMeta.color }} />
            <span style={{ color: syncMeta.color, fontSize: 10 }}>{syncMeta.label}</span>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <button onClick={() => setShowAdd(true)} style={{ background: "#3A9BE8", border: "none", borderRadius: 8, padding: "7px 14px", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>+ Add</button>
          <button onClick={onSignOut} title="Sign out" style={{ background: "none", border: "1px solid #2a2a2e", borderRadius: 8, padding: "7px 10px", color: "#888", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>Sign out</button>
        </div>
      </div>
      <div style={{ display: "flex", padding: "12px 16px 0", borderBottom: "1px solid #1a1a1e" }}>
        {TABS.map(t => <button key={t} onClick={() => setTab(t)} style={{ flex: 1, background: "none", border: "none", borderBottom: tab === t ? "2px solid #eee" : "2px solid transparent", padding: "8px 0 10px", color: tab === t ? "#eee" : "#555", fontSize: 13, fontWeight: tab === t ? 600 : 400, cursor: "pointer", fontFamily: "inherit" }}>{t}</button>)}
      </div>
      <div style={{ padding: "14px 16px 100px" }}>
        <div style={{ display: tab === "PBs" ? "block" : "none" }}>
          <PBTab exercises={exercises} onUpdate={handleUpdate} onDelete={handleDelete} />
        </div>
        <div style={{ display: tab === "Workouts" ? "block" : "none" }}>
          <WorkoutsTab exercises={exercises} workouts={workouts} onSaveWorkout={handleSaveWorkout} onEditWorkout={handleEditWorkout} onDeleteWorkout={handleDeleteWorkout} />
        </div>
        <div style={{ display: tab === "Progress" ? "block" : "none" }}>
          <ProgressTab exercises={exercises} workouts={workouts} />
        </div>
      </div>
      {showAdd && <AddExerciseSheet onAdd={handleAdd} onClose={() => setShowAdd(false)} existingNames={exercises.map(e => e.name)} />}
      {celebration && <Celebration pbs={celebration} onDone={() => setCelebration(null)} />}
    </div>
  );
}

// ─── Auth gate ───
function AuthGate({ onAuth }) {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [msg, setMsg] = useState("");

  const submit = async () => {
    setErr(""); setMsg("");
    if (!email.trim() || !password) { setErr("Enter your email and password."); return; }
    setBusy(true);
    try {
      if (mode === "signup") {
        const { data, error } = await supa.auth.signUp({ email: email.trim(), password });
        if (error) throw error;
        if (data.session) onAuth(data.session);
        else setMsg("Account created. Check your email to confirm, then sign in.");
      } else {
        const { data, error } = await supa.auth.signInWithPassword({ email: email.trim(), password });
        if (error) throw error;
        onAuth(data.session);
      }
    } catch (e) { setErr(e.message || "Something went wrong."); }
    setBusy(false);
  };

  return (
    <div style={{ background: "#0e0e10", minHeight: "100vh", fontFamily: "'Inter', system-ui, sans-serif", maxWidth: 480, margin: "0 auto", display: "flex", flexDirection: "column", justifyContent: "center", padding: "0 24px" }}>
      <div style={{ textAlign: "center", marginBottom: 28 }}>
        <div style={{ fontSize: 40, marginBottom: 10 }}>🏋️</div>
        <h1 style={{ color: "#f0f0f0", fontSize: 24, fontWeight: 700, margin: 0, letterSpacing: "-0.03em" }}>Gym Tracker</h1>
        <div style={{ color: "#666", fontSize: 13, marginTop: 4 }}>{mode === "signup" ? "Create your account" : "Sign in to your history"}</div>
      </div>
      <input type="email" inputMode="email" autoCapitalize="none" autoCorrect="off" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)}
        style={{ width: "100%", boxSizing: "border-box", background: "#1a1a1e", border: "1px solid #2a2a2e", borderRadius: 8, padding: "12px 14px", color: "#eee", fontSize: 15, outline: "none", fontFamily: "inherit", marginBottom: 10 }} />
      <input type="password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)}
        onKeyDown={e => { if (e.key === "Enter") submit(); }}
        style={{ width: "100%", boxSizing: "border-box", background: "#1a1a1e", border: "1px solid #2a2a2e", borderRadius: 8, padding: "12px 14px", color: "#eee", fontSize: 15, outline: "none", fontFamily: "inherit", marginBottom: 14 }} />
      {err && <div style={{ color: "#e5606a", fontSize: 13, marginBottom: 10 }}>{err}</div>}
      {msg && <div style={{ color: "#3AE89B", fontSize: 13, marginBottom: 10 }}>{msg}</div>}
      <button onClick={submit} disabled={busy}
        style={{ width: "100%", background: busy ? "#245" : "#3A9BE8", border: "none", borderRadius: 8, padding: "13px", color: "#fff", fontSize: 15, fontWeight: 600, cursor: busy ? "default" : "pointer", fontFamily: "inherit" }}>
        {busy ? "Please wait…" : (mode === "signup" ? "Create account" : "Sign in")}
      </button>
      <button onClick={() => { setMode(mode === "signup" ? "signin" : "signup"); setErr(""); setMsg(""); }}
        style={{ background: "none", border: "none", color: "#888", fontSize: 13, cursor: "pointer", fontFamily: "inherit", marginTop: 16, textAlign: "center" }}>
        {mode === "signup" ? "Already have an account? Sign in" : "New here? Create an account"}
      </button>
    </div>
  );
}

// ─── Config / splash ───
function CenterMsg({ children }) {
  return <div style={{ background: "#0e0e10", minHeight: "100vh", fontFamily: "'Inter', system-ui, sans-serif", display: "flex", alignItems: "center", justifyContent: "center", padding: "0 28px", textAlign: "center" }}>{children}</div>;
}

function Root() {
  const [session, setSession] = useState(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    if (!CONFIG_OK) { setReady(true); return; }
    supa.auth.getSession().then(({ data }) => {
      if (data.session) { currentUserId = data.session.user.id; setSession(data.session); }
      setReady(true);
    });
    const { data: sub } = supa.auth.onAuthStateChange((_e, s) => {
      currentUserId = s ? s.user.id : null;
      setSession(s);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  if (!CONFIG_OK) return <CenterMsg><div><div style={{ fontSize: 32, marginBottom: 12 }}>⚙️</div><div style={{ color: "#eee", fontSize: 16, fontWeight: 600, marginBottom: 8 }}>Almost there</div><div style={{ color: "#888", fontSize: 13, lineHeight: 1.6 }}>Open index.html and paste your Supabase project URL and anon key near the top, then reload.</div></div></CenterMsg>;
  if (!ready) return <CenterMsg><div style={{ color: "#555", fontSize: 14 }}>Loading…</div></CenterMsg>;
  if (!session) return <AuthGate onAuth={s => { currentUserId = s.user.id; setSession(s); }} />;
  return <MainApp key={session.user.id} onSignOut={async () => { cacheClear(); await supa.auth.signOut(); currentUserId = null; setSession(null); }} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
