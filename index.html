// ─── PBs ───
// exercise.pbs is the manual/seed baseline. Displayed PBs are the best of that baseline
// and every logged set, so deleting or editing a workout corrects them automatically.
function derivePbs(ex, workouts) {
  const best = {};
  const take = (reps, kg) => { if (!(best[reps] >= kg)) best[reps] = kg; };
  ex.pbs.forEach(p => take(p.reps, p.kg));
  workouts.forEach(w => w.exercises.forEach(wex => { if (wexMatches(ex, wex)) wex.sets.forEach(s => take(s.reps, s.kg)); }));
  return Object.keys(best).map(r => ({ reps: Number(r), kg: best[r] })).sort((a, b) => b.reps - a.reps);
}
const withDerivedPbs = (exercises, workouts) => exercises.map(ex => ({ ...ex, basePbs: ex.pbs, pbs: derivePbs(ex, workouts) }));

// Sets in `workout` that beat the PBs implied by `exercises` + `priorWorkouts`.
function newPbsIn(workout, exercises, priorWorkouts) {
  const beaten = []; // { name, perHand, reps, kg, prev }
  workout.exercises.forEach(wex => {
    const ex = findExFor(exercises, wex);
    if (!ex) return;
    const prior = {};
    derivePbs(ex, priorWorkouts).forEach(p => { prior[p.reps] = p.kg; });
    // For each rep count, only the best set of the session counts
    const bestByReps = {};
    wex.sets.forEach(s => { if (!(bestByReps[s.reps] >= s.kg)) bestByReps[s.reps] = s.kg; });
    Object.keys(bestByReps).forEach(r => {
      const reps = Number(r), kg = bestByReps[r];
      if (prior[reps] == null) beaten.push({ name: wex.name, perHand: ex.perHand, reps, kg, prev: null });
      else if (kg > prior[reps]) beaten.push({ name: wex.name, perHand: ex.perHand, reps, kg, prev: prior[reps] });
    });
  });
  return beaten;
}

async function remoteRead() {
  if (!supa || !currentUserId) return { ok: false, data: null };
  try {
    const { data, error } = await supa.from("user_data").select("exercises,workouts,updated_at").eq("user_id", currentUserId).maybeSingle();
    return error ? { ok: false, data: null } : { ok: true, data: data || null };
  } catch { return { ok: false, data: null }; }
}

  if (!supa || !currentUserId) return false;
  try {
    const { error } = await supa.from("user_data").upsert({ user_id: currentUserId, exercises, workouts, updated_at: ts }, { onConflict: "user_id" });
    return !error;
  } catch { return false; }
}

// ─── Per-exercise history (newest first) ───
function ExerciseHistory({ ex, workouts }) {
  const [showAll, setShowAll] = useState(false);
  const sessions = useMemo(() => [...workouts].sort(newestFirst)
    .map(w => { const wex = w.exercises.find(e => wexMatches(ex, e)); return wex && { id: w.id, date: w.date, sets: wex.sets }; })
    .filter(Boolean), [ex.id, ex.name, workouts]);
  const shown = showAll ? sessions : sessions.slice(0, 5);
  return (
    <div style={{ background: "#111113", borderRadius: 8, padding: 10, marginBottom: 10 }}>
      <div style={{ color: "#777", fontSize: 10, fontWeight: 600, marginBottom: 6, letterSpacing: "0.03em" }}>History</div>
      {sessions.length === 0 && <div style={{ color: "#555", fontSize: 12 }}>Not logged yet</div>}
      {shown.map((s, i) => (
        <div key={s.id} style={{ display: "flex", gap: 10, padding: "5px 0", borderTop: i ? "1px solid #1c1c20" : "none" }}>
          <span style={{ color: "#aaa", fontSize: 12, minWidth: 44, flexShrink: 0 }}>{fmtShortDate(s.date)}</span>
          <span style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>{s.sets.map((st, j) => <SetText key={j} ex={ex} set={st} last={j === s.sets.length - 1} />)}</span>
        </div>
      ))}
      {sessions.length > 5 && (
        <button onClick={() => setShowAll(!showAll)} style={{ background: "none", border: "none", color: "#8af", fontSize: 11, cursor: "pointer", fontFamily: "inherit", padding: "6px 0 0" }}>
          {showAll ? "Show less" : `Show all ${sessions.length}`}
        </button>
      )}
    </div>
  );
}

// ─── PB Tab ───
function PBTab({ exercises, workouts, onUpdate, onDelete, emptyStatus, onAddClick, onLoadStarter }) {

// ─── Rest timer ───
// Counts down to an end timestamp, so it stays accurate even if the page was throttled.
// On finish it beeps (Web Audio, unlocked by the start tap) and vibrates where supported.
function RestTimer() {
  const [run, setRun] = useState(null); // { endAt, total } in ms
  const [now, setNow] = useState(() => Date.now());
  const [done, setDone] = useState(false);
  const audio = useRef(null);

  const alertDone = () => {
    try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch {}
    const ctx = audio.current;
    if (!ctx) return;
    try {
      [0, 0.25, 0.5].forEach(at => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        const t0 = ctx.currentTime + at;
        o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
        o.start(t0); o.stop(t0 + 0.2);
      });
    } catch {}
  };

  useEffect(() => () => { try { audio.current?.close(); } catch {} }, []);
  useEffect(() => {
    if (!run) return;
    const t = setInterval(() => {
      const n = Date.now(); setNow(n);
      if (n >= run.endAt) { clearInterval(t); setRun(null); setDone(true); alertDone(); }
    }, 250);
    return () => clearInterval(t);
  }, [run]);
  useEffect(() => {
    if (!done) return;
    const t = setTimeout(() => setDone(false), 8000);
    return () => clearTimeout(t);
  }, [done]);

  const start = secs => {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC && !audio.current) audio.current = new AC();
      audio.current?.resume();
    } catch {}
    const n = Date.now();
    setNow(n); setDone(false); setRun({ endAt: n + secs * 1000, total: secs * 1000 });
  };
  const extend = secs => setRun(r => r && { endAt: r.endAt + secs * 1000, total: r.total + secs * 1000 });

  const left = run ? Math.max(0, Math.ceil((run.endAt - now) / 1000)) : 0;
  const pct = run ? Math.max(0, Math.min(100, 100 * (run.endAt - now) / run.total)) : 0;
  const smallBtn = { background: "#111", border: "1px solid #2a2a2e", borderRadius: 14, padding: "4px 10px", color: "#aaa", fontSize: 12, cursor: "pointer", fontFamily: "inherit" };

  return (
    <>
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 12 }}>
        <span style={{ color: "#777", fontSize: 11, marginRight: 2 }}>Rest timer</span>
        {[60, 90, 120].map(s => <button key={s} onClick={() => start(s)} style={smallBtn}>{s === 120 ? "2m" : `${s}s`}</button>)}
      </div>
      {(run || done) && (
        <div style={{ position: "fixed", left: 16, right: 16, bottom: "calc(16px + env(safe-area-inset-bottom))", maxWidth: 448, margin: "0 auto", zIndex: 50, background: done ? "#12301f" : "#1f1f24", border: `1px solid ${done ? "#3AE89B66" : "#333"}`, borderRadius: 12, padding: "10px 12px", boxShadow: "0 8px 24px rgba(0,0,0,0.5)", overflow: "hidden" }}>
          {done ? (
            <button onClick={() => setDone(false)} style={{ width: "100%", background: "none", border: "none", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", fontFamily: "inherit", padding: 0 }}>
              <span style={{ color: "#3AE89B", fontSize: 15, fontWeight: 700 }}>Rest over — next set 💪</span>
              <span style={{ color: "#5a8", fontSize: 11 }}>dismiss</span>
            </button>
          ) : (
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ color: "#888", fontSize: 12 }}>Rest</span>
              <span style={{ color: "#eee", fontSize: 20, fontWeight: 700, fontVariantNumeric: "tabular-nums", flex: 1 }}>{Math.floor(left / 60)}:{String(left % 60).padStart(2, "0")}</span>
              <button onClick={() => extend(15)} style={smallBtn}>+15s</button>
              <button onClick={() => setRun(null)} style={{ ...smallBtn, padding: "4px 10px" }}>×</button>
            </div>
          )}
          {run && <div style={{ position: "absolute", left: 0, bottom: 0, height: 3, width: `${pct}%`, background: "#3A9BE8" }} />}
        </div>
      )}
    </>
  );
}

// ─── Log Workout ───
function LogWorkout({ exercises, workouts, onSave, onCancel, prefill, editing }) {
  const [name, setName] = useState(prefill?.name || "");
  const [search, setSearch] = useState("");
  const [items, setItems] = useState(() => {
    if (prefill) return prefill.exercises.map(ex => ({ name: ex.name, exerciseId: ex.exerciseId, sets: ex.sets.map(s => ({ reps: String(s.reps), kg: String(s.kg), pos: s.pos || "" })) }));
    return [];
  });

  // Earlier sessions, newest first — the "last time" target. When editing, only sessions before it.
  const history = useMemo(() => workouts
    .filter(w => !editing || (w.id !== editing.id && new Date(w.date) < new Date(editing.date)))
    .sort(newestFirst), [workouts, editing]);
  const lastSession = ex => {
    for (const w of history) { const wex = w.exercises.find(e => wexMatches(ex, e)); if (wex) return { date: w.date, sets: wex.sets }; }
    return null;
  };

  const q = search.trim().toLowerCase();
  const available = exercises.filter(e =>
    (e.name.toLowerCase().includes(q) || e.area.toLowerCase().includes(q) || e.muscle.toLowerCase().includes(q))
    && !items.find(s => s.name === e.name));
  const addEx = ex => {
    // One PB: seed it directly. Multiple: leave sets empty so the rep chooser shows. None: one blank set.
    let seedSets;
    if (ex.pbs.length === 1) seedSets = [{ reps: String(ex.pbs[0].reps), kg: String(ex.pbs[0].kg), pos: "" }];
    else if (ex.pbs.length === 0) seedSets = [{ reps: "", kg: "", pos: "" }];
    else seedSets = [];
    setItems(prev => [...prev, { name: ex.name, exerciseId: ex.id, sets: seedSets }]);
    setSearch("");
  };
  const chooseRep = (ei, pb) => setItems(prev => prev.map((e, i) => i === ei ? { ...e, sets: [{ reps: String(pb.reps), kg: String(pb.kg), pos: "" }] } : e));
  const removeEx = i => setItems(prev => prev.filter((_, j) => j !== i));
  const moveEx = (i, dir) => { setItems(prev => { const n = [...prev]; const t = n[i]; n[i] = n[i + dir]; n[i + dir] = t; return n; }); };
  const updateSet = (ei, si, f, v) => setItems(prev => { const n = prev.map((e, i) => i === ei ? { ...e, sets: e.sets.map((s, j) => j === si ? { ...s, [f]: v } : s) } : e); return n; });
  // New set copies the previous one
  const addSet = ei => setItems(prev => prev.map((e, i) => {
    if (i !== ei) return e;
    const last = e.sets[e.sets.length - 1] || { reps: "", kg: "", pos: "" };
    return { ...e, sets: [...e.sets, { ...last }] };
  }));
  const removeSet = (ei, si) => setItems(prev => prev.map((e, i) => i === ei ? { ...e, sets: e.sets.filter((_, j) => j !== si) } : e));
  const canSave = items.length > 0 && items.every(ex => ex.sets.some(s => s.reps && s.kg));

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <span style={{ color: "#eee", fontSize: 16, fontWeight: 600 }}>{editing ? "Edit workout" : prefill ? "Repeat workout" : "Log workout"}</span>
        <button onClick={onCancel} style={{ background: "none", border: "1px solid #2a2a2e", borderRadius: 6, padding: "5px 12px", color: "#888", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>Cancel</button>
      </div>

      <input type="text" placeholder="Workout name (optional), e.g. Push Day" value={name} onChange={e => setName(e.target.value)}
        style={{ ...inputStyle, width: "100%", boxSizing: "border-box", marginBottom: 12 }} />

      <RestTimer />

      {items.map((ex, ei) => {
        const exData = exercises.find(e => e.id === ex.exerciseId) || exercises.find(e => e.name === ex.name);
        const col = exData ? AREA_COLORS[exData.area] : "#888";
        const last = lastSession(exData || { id: ex.exerciseId, name: ex.name });
        const positions = exData?.positions || [];
        const narrow = positions.length > 0;
        return (
          <div key={ex.name} style={{ background: "#1a1a1e", borderRadius: 10, borderLeft: `3px solid ${col}`, marginBottom: 8, padding: "12px 14px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <div style={{ flex: 1 }}>
                <div style={{ color: "#eee", fontSize: 13, fontWeight: 600 }}>{ex.name}</div>
                {exData && exData.pbs.length > 0 && <div style={{ color: "#555", fontSize: 10, marginTop: 1 }}>PB: {exData.pbs.map(p => fmtSet(exData, p.reps, p.kg)).join(" · ")}</div>}
                {last && <div style={{ color: "#777", fontSize: 10, marginTop: 1 }}>Last ({fmtShortDate(last.date)}): {last.sets.map(s => fmtSet(exData, s.reps, s.kg) + (s.pos ? ` (${s.pos})` : "")).join(" · ")}</div>}
              </div>
              <div style={{ display: "flex", gap: 2, alignItems: "center" }}>
                {ei > 0 && <button onClick={() => moveEx(ei, -1)} style={{ background: "none", border: "none", color: "#555", fontSize: 16, cursor: "pointer", padding: "2px 5px" }}>↑</button>}
                {ei < items.length - 1 && <button onClick={() => moveEx(ei, 1)} style={{ background: "none", border: "none", color: "#555", fontSize: 16, cursor: "pointer", padding: "2px 5px" }}>↓</button>}
                <button onClick={() => removeEx(ei)} style={{ background: "none", border: "none", color: "#664", fontSize: 18, cursor: "pointer", padding: "2px 5px" }}>×</button>
              </div>
            </div>
            {ex.sets.length === 0 ? (
              <div>
                <div style={{ color: "#888", fontSize: 11, marginBottom: 7 }}>How many reps today?</div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  {exData && [...exData.pbs].sort((a, b) => b.reps - a.reps).map(p => (
                    <button key={p.reps} onClick={() => chooseRep(ei, p)}
                      style={{ background: `${col}15`, border: `1px solid ${col}40`, borderRadius: 8, padding: "8px 12px", cursor: "pointer", fontFamily: "inherit", textAlign: "center" }}>
                      <div style={{ color: col, fontSize: 14, fontWeight: 700 }}>{p.reps} reps</div>
                      <div style={{ color: "#999", fontSize: 11 }}>{fmtKg(exData, p.kg)} PB</div>
                    </button>
                  ))}
                </div>
              </div>
            ) : (
              <>
                {ex.sets.map((s, si) => {
                  const prev = last?.sets[si];
                  return (
                    <div key={si} style={{ display: "flex", gap: 6, marginBottom: 5, alignItems: "center" }}>
                      <span style={{ color: "#555", fontSize: 11, width: 24, flexShrink: 0 }}>S{si + 1}</span>
                      <input type="number" placeholder={prev ? String(prev.reps) : "Reps"} value={s.reps} onChange={e => updateSet(ei, si, "reps", e.target.value)} style={{ ...inputStyle, width: narrow ? 40 : 58 }} />
                      <span style={{ color: "#555", fontSize: 12 }}>×</span>
                      <input type="number" placeholder={prev ? String(prev.kg) : "kg"} value={s.kg} step="0.5" onChange={e => updateSet(ei, si, "kg", e.target.value)} style={{ ...inputStyle, width: narrow ? 48 : 68 }} />
                      <span style={{ color: "#888", fontSize: 11 }}>{kgUnit(exData)}</span>
                      {narrow && (
                        <select value={s.pos || ""} onChange={e => updateSet(ei, si, "pos", e.target.value)} style={{ ...inputStyle, padding: "8px 2px", width: 74, color: s.pos ? "#eee" : "#666" }}>
                          <option value="">pos…</option>
                          {positions.map(p => <option key={p} value={p}>{p}</option>)}
                        </select>
                      )}
                      {ex.sets.length > 1 && <button onClick={() => removeSet(ei, si)} style={{ background: "none", border: "none", color: "#553", fontSize: 14, cursor: "pointer" }}>×</button>}
                    </div>
                  );
                })}
                <button onClick={() => addSet(ei)} style={{ background: "none", border: "1px dashed #2a2a2e", borderRadius: 6, padding: "4px 10px", color: "#555", fontSize: 11, cursor: "pointer", fontFamily: "inherit", marginTop: 2 }}>+ Set</button>
              </>
            )}
          </div>
        );
      })}

      <div style={{ position: "relative", marginTop: 4, marginBottom: 6 }}>
        <div style={{ position: "absolute", left: 11, top: "50%", transform: "translateY(-50%)" }}><SvgSearch /></div>
        <input type="text" placeholder="Add by name, area, or muscle..." value={search} onChange={e => setSearch(e.target.value)}
          style={{ width: "100%", boxSizing: "border-box", background: "#111", border: "1px solid #2a2a2e", borderRadius: 8, padding: "10px 12px 10px 34px", color: "#eee", fontSize: 13, outline: "none", fontFamily: "inherit" }} />
      </div>
      {search && (
        <div style={{ background: "#151517", borderRadius: 8, marginBottom: 10, maxHeight: 260, overflow: "auto" }}>
          {available.length === 0 && <div style={{ color: "#555", padding: "10px 14px", fontSize: 12 }}>No matches</div>}
          {available.slice(0, 30).map(ex => (
            <button key={ex.name} onClick={() => addEx(ex)}
              style={{ width: "100%", background: "none", border: "none", borderBottom: "1px solid #1a1a1e", padding: "10px 14px", cursor: "pointer", textAlign: "left", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div><div style={{ color: "#ddd", fontSize: 13 }}>{ex.name}</div><div style={{ color: "#555", fontSize: 10 }}>{ex.area} · {ex.muscle}</div></div>
              <span style={{ color: "#3A9BE8", fontSize: 18 }}>+</span>
            </button>
          ))}
        </div>
      )}
      <button onClick={() => {
        const workout = { id: uid(), date: new Date().toISOString(), name: name.trim() || null, exercises: items.map(ex => ({ name: ex.name, exerciseId: ex.exerciseId, sets: ex.sets.filter(s => s.reps && s.kg).map(s => ({ reps: Number(s.reps), kg: Number(s.kg), ...(s.pos ? { pos: s.pos } : {}) })) })).filter(ex => ex.sets.length > 0) };
        onSave(workout);
      }} disabled={!canSave}
        style={{ width: "100%", background: canSave ? "#3A9BE8" : "#222", border: "none", borderRadius: 8, padding: "12px", color: canSave ? "#fff" : "#555", fontSize: 14, fontWeight: 600, cursor: canSave ? "pointer" : "default", fontFamily: "inherit", marginTop: 8 }}>
        {editing ? "Save changes" : "Save workout"}
      </button>
    </div>
  );
}

// ─── Progress Tab ───
function ProgressTab({ exercises, workouts }) {
  const [picked, setSelected] = useState("");
  const [searchP, setSearchP] = useState("");
  // Default to the first exercise, including once a new account adds or loads some.
  const selected = exercises.some(e => e.name === picked) ? picked : (exercises[0]?.name || "");
  const ex = exercises.find(e => e.name === selected);
  const col = ex ? AREA_COLORS[ex.area] : "#888";
  const searchResults = exercises.filter(e => e.name.toLowerCase().includes(searchP.toLowerCase()));

  // Build real chart data from workouts
  const chartData = useMemo(() => {
    if (!ex) return [];
    const twoMonthsAgo = new Date(); twoMonthsAgo.setMonth(twoMonthsAgo.getMonth() - 2);
    const repMap = {};
    workouts.filter(w => new Date(w.date) >= twoMonthsAgo).sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(w => {
      const wex = w.exercises.find(e => e.exerciseId === ex.id) || w.exercises.find(e => e.name === ex.name);
      if (!wex) return;
      wex.sets.forEach(s => {
        if (!repMap[s.reps]) repMap[s.reps] = [];
        const dateStr = new Date(w.date).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
        const existing = repMap[s.reps].find(p => p.date === dateStr);
        if (existing) { if (s.kg > existing.kg) existing.kg = s.kg; }
        else repMap[s.reps].push({ date: dateStr, kg: s.kg });
      });
    });
    return Object.entries(repMap).sort(([a], [b]) => Number(b) - Number(a)).map(([reps, history]) => ({ reps: Number(reps), history }));
  }, [ex, workouts]);

  const hasData = chartData.length > 0;

  return (
    <div>
      <SearchBox value={searchP} onChange={setSearchP} placeholder="Find exercise..." />
      <div style={{ display: "flex", gap: 5, overflowX: "auto", paddingBottom: 8, marginBottom: 12, WebkitOverflowScrolling: "touch" }}>
        {searchResults.map(e => {
          const active = selected === e.name; const c = AREA_COLORS[e.area];
          return <button key={e.name} onClick={() => { setSelected(e.name); setSearchP(""); }}
            style={{ background: active ? `${c}20` : "#1a1a1e", border: `1px solid ${active ? `${c}50` : "#2a2a2e"}`, borderRadius: 8, padding: "6px 12px", color: active ? c : "#888", fontSize: 12, cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap", flexShrink: 0 }}>
            {e.name}
          </button>;
        })}
      </div>
      {ex && (
        <div>
          <div style={{ color: "#eee", fontSize: 16, fontWeight: 600, marginBottom: 2 }}>{ex.name}</div>
          <div style={{ color: "#666", fontSize: 12, marginBottom: 14 }}>{ex.area} · {ex.muscle} · Last 2 months</div>
          {!hasData && (
            <div style={{ color: "#555", textAlign: "center", padding: "30px 20px", fontSize: 13, background: "#1a1a1e", borderRadius: 10 }}>
              No workout data yet for this exercise. Log a workout to see progress here.
            </div>
          )}
          {chartData.map(h => (
            <div key={h.reps} style={{ background: "#1a1a1e", borderRadius: 10, padding: "12px 10px", marginBottom: 10 }}>
              <div style={{ color: "#999", fontSize: 12, marginBottom: 6, fontWeight: 500 }}>
                {h.reps}-rep max
                <span style={{ color: col, fontWeight: 700, marginLeft: 8 }}>{fmtKg(ex, h.history[h.history.length - 1]?.kg)}</span>
              </div>
              <ResponsiveContainer width="100%" height={120}>
                <LineChart data={h.history} margin={{ top: 4, right: 4, bottom: 0, left: -24 }}>
                  <XAxis dataKey="date" tick={{ fill: "#555", fontSize: 9 }} axisLine={false} tickLine={false} interval="preserveStartEnd" />
                  <YAxis tick={{ fill: "#555", fontSize: 10 }} axisLine={false} tickLine={false} domain={["dataMin - 5", "dataMax + 5"]} />
                  <Tooltip contentStyle={{ background: "#222", border: "none", borderRadius: 6, fontSize: 12, color: "#eee" }} labelStyle={{ color: "#888" }} />
                  <Line type="monotone" dataKey="kg" stroke={col} strokeWidth={2} dot={{ r: 3, fill: col }} activeDot={{ r: 5 }} />
                </LineChart>
              </ResponsiveContainer>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── PB Celebration ───

      id: i,

        <div key={c.id} style={{
          position: "absolute", top: 0, left: `${c.left}%`,
          width: c.size, height: c.size * 0.5, background: c.color, borderRadius: 1,
          transform: `rotate(${c.rot}deg)`,
          animation: `pbFall ${c.dur}s ${c.delay}s ease-in forwards`,

        <div style={{ fontSize: 64, marginBottom: 8, animation: "pbPop 0.6s 0.1s cubic-bezier(0.34,1.56,0.64,1) both" }}>🏆</div>
        <div style={{ color: "#E8B931", fontSize: 26, fontWeight: 800, letterSpacing: "-0.02em", marginBottom: 4, animation: "pbGlow 1.8s ease-in-out infinite", fontFamily: "'Inter', system-ui, sans-serif" }}>
          {single ? "New PB!" : `${pbs.length} New PBs!`}
        </div>
        <div style={{ color: "#aaa", fontSize: 13, marginBottom: 16, fontFamily: "'Inter', system-ui, sans-serif" }}>Nice work 💪</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {pbs.slice(0, 5).map((p, i) => (
            <div key={i} style={{ background: "rgba(232,185,49,0.1)", border: "1px solid rgba(232,185,49,0.3)", borderRadius: 8, padding: "8px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", animation: `pbRowIn 0.4s ${0.3 + i * 0.1}s both`, fontFamily: "'Inter', system-ui, sans-serif" }}>
              <span style={{ color: "#eee", fontSize: 13, fontWeight: 500 }}>{p.name}</span>
              <span style={{ color: "#E8B931", fontSize: 13, fontWeight: 700 }}>
                {fmtSet(p, p.reps, p.kg)}{p.prev != null ? <span style={{ color: "#777", fontWeight: 400 }}>  (was {fmtKg(p, p.prev)})</span> : <span style={{ color: "#777", fontWeight: 400 }}>  (new rep max)</span>}
              </span>
            </div>
          ))}
        </div>
        <div style={{ color: "#555", fontSize: 11, marginTop: 16, fontFamily: "'Inter', system-ui, sans-serif" }}>tap to dismiss</div>
      </div>
    </div>
  );
}

// ─── App ───
const TABS = ["PBs", "Workouts", "Progress"];

function MainApp({ onSignOut }) {
  const [exercises, setExercises] = useState([]);
  const [workouts, setWorkouts] = useState([]);
  const [tab, setTab] = useState("PBs");
  const [showAdd, setShowAdd] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [celebration, setCelebration] = useState(null); // array of beaten PBs
  const [sync, setSync] = useState("syncing"); // "synced" | "syncing" | "offline"
  const bootRef = useRef(false);
  const readyRef = useRef(false); // becomes true after first reconcile — gates pushes

  // No local cache (new device or brand-new account): ask the cloud before writing anything,
  // so opening offline on a new device can never overwrite real data with an empty list.
  const loadFresh = useCallback(async () => {
    if (!navigator.onLine) { setSync("offline"); return; }
    setSync("syncing");
    const { ok, data: remote } = await remoteRead();
    if (!ok) { setSync("offline"); return; }
    if (remote) {
      const ex = remote.exercises || [];
      setExercises(ex);
      setWorkouts(remote.workouts || []);
      cacheWrite(ex, remote.workouts || [], remote.updated_at, false);
    }
    // No row yet = brand-new account: start empty; the PBs tab offers a starter set.
    readyRef.current = true;
    setSync("synced");
  }, []);

  // Boot: show cached data instantly (works offline), then reconcile with the cloud.
  useEffect(() => {
    if (bootRef.current) return; bootRef.current = true;
    const c = cacheRead();

    if (c.exercises) {
      // Returning user on this device — load cached data instantly, then reconcile with the cloud.
      setExercises(c.exercises);
      if (c.workouts) setWorkouts(c.workouts);
      setLoaded(true);

      (async () => {
        if (!navigator.onLine) { setSync("offline"); readyRef.current = true; return; }
        setSync("syncing");
        const { data: remote } = await remoteRead();
        const remoteWins = remote && (!c.ts || (!c.dirty && new Date(remote.updated_at) >= new Date(c.ts)));
        if (remoteWins) {
          if (remote.exercises) setExercises(remote.exercises);
          setWorkouts(remote.workouts || []);
          cacheWrite(remote.exercises || c.exercises, remote.workouts || [], remote.updated_at, false);
          setSync("synced");
        } else {
          const ts = c.ts || new Date().toISOString();
          const ok = await remotePush(c.exercises, c.workouts, ts);
          cacheWrite(c.exercises, c.workouts, ts, !ok);
          setSync(ok ? "synced" : "offline");
        }
        readyRef.current = true;
      })();
      return;
    }

    setLoaded(true);
    loadFresh();
  }, []);

  // On change: save to phone immediately, then push to cloud if online
  useEffect(() => {
    if (!loaded || !readyRef.current) return;
    const ts = new Date().toISOString();
    cacheWrite(exercises, workouts, ts, true);
    (async () => {
      if (!navigator.onLine) { setSync("offline"); return; }
      setSync("syncing");
      const ok = await remotePush(exercises, workouts, ts);
      if (ok) { try { localStorage.setItem(ck("dirty"), "0"); } catch {} setSync("synced"); }
      else setSync("offline");
    })();
  }, [exercises, workouts, loaded]);

  // Flush queued changes when the connection returns (or finish the first load if it never ran)
  useEffect(() => {
    const onOnline = async () => {
      if (!readyRef.current) { loadFresh(); return; }
      const c = cacheRead();
      if (c.dirty) {
        setSync("syncing");
        const ok = await remotePush(c.exercises, c.workouts, c.ts || new Date().toISOString());
        if (ok) { try { localStorage.setItem(ck("dirty"), "0"); } catch {} setSync("synced"); }
        else setSync("offline");
      } else setSync("synced");
    };
    const onOffline = () => setSync("offline");
    window.addEventListener("online", onOnline);
    window.addEventListener("offline", onOffline);
    return () => { window.removeEventListener("online", onOnline); window.removeEventListener("offline", onOffline); };
  }, []);

  const syncMeta = sync === "offline"
    ? { color: "#E8B931", label: "Offline · saved on device" }
    : sync === "syncing"
    ? { color: "#666", label: "Syncing…" }
    : { color: "#3AE89B", label: "Synced" };

  // What every tab displays: baseline PBs merged with the best logged sets.
  const shown = useMemo(() => withDerivedPbs(exercises, workouts), [exercises, workouts]);
  const emptyStatus = readyRef.current ? "ready" : sync === "offline" ? "offline" : "loading";

  const handleDelete = useCallback(id => setExercises(prev => prev.filter(e => e.id !== id)), []);
  const handleUpdate = useCallback(updated => setExercises(prev => prev.map(e => e.id === updated.id ? updated : e)), []);
  const handleAdd = useCallback(ex => { setExercises(prev => [...prev, ex].sort((a, b) => a.name.localeCompare(b.name))); setShowAdd(false); }, []);
  const handleLoadStarter = useCallback(key => setExercises(prev => prev.length ? prev : (key === "jack" ? SEED_JACK : SEED_JAKEY)), []);

  const handleSaveWorkout = useCallback(w => {
    const beaten = newPbsIn(w, exercises, workouts);
    setWorkouts(prev => [w, ...prev]);
    if (beaten.length) setCelebration(beaten);
  }, [exercises, workouts]);

  // PBs are derived from workouts, so deleting or editing one corrects them on its own.
  const handleDeleteWorkout = useCallback(id => setWorkouts(prev => prev.filter(w => w.id !== id)), []);

  const handleEditWorkout = useCallback((id, changes) => {
    const old = workouts.find(w => w.id === id);
    if (!old) return;
    const updated = { ...old, ...changes };
    // Compare against everything including the old version, so fixing a typo doesn't re-celebrate.
    const beaten = newPbsIn(updated, exercises, workouts);
    setWorkouts(prev => prev.map(w => w.id === id ? updated : w));
    if (beaten.length) setCelebration(beaten);
  }, [exercises, workouts]);

  if (!loaded) return <div style={{ background: "#0e0e10", minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}><div style={{ color: "#555", fontSize: 14 }}>Loading...</div></div>;

  return (
    <div style={{ background: "#0e0e10", minHeight: "100vh", fontFamily: "'Inter', system-ui, sans-serif", maxWidth: 480, margin: "0 auto" }}>
      <div style={{ padding: "16px 16px 0", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <h1 style={{ color: "#f0f0f0", fontSize: 22, fontWeight: 700, margin: 0, letterSpacing: "-0.03em" }}>Gym Tracker</h1>
          <div style={{ display: "flex", alignItems: "center", gap: 5, marginTop: 3 }}>
            <span style={{ width: 6, height: 6, borderRadius: 3, background: syncMeta.color }} />
            <span style={{ color: syncMeta.color, fontSize: 10 }}>{syncMeta.label}</span>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <button onClick={() => setShowAdd(true)} style={{ background: "#3A9BE8", border: "none", borderRadius: 8, padding: "7px 14px", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>+ Add</button>
          <button onClick={onSignOut} title="Sign out" style={{ background: "none", border: "1px solid #2a2a2e", borderRadius: 8, padding: "7px 10px", color: "#888", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>Sign out</button>
        </div>
      </div>
      <div style={{ display: "flex", padding: "12px 16px 0", borderBottom: "1px solid #1a1a1e" }}>
        {TABS.map(t => <button key={t} onClick={() => setTab(t)} style={{ flex: 1, background: "none", border: "none", borderBottom: tab === t ? "2px solid #eee" : "2px solid transparent", padding: "8px 0 10px", color: tab === t ? "#eee" : "#555", fontSize: 13, fontWeight: tab === t ? 600 : 400, cursor: "pointer", fontFamily: "inherit" }}>{t}</button>)}
      </div>
      <div style={{ padding: "14px 16px 100px" }}>
        <div style={{ display: tab === "PBs" ? "block" : "none" }}>
          <PBTab exercises={shown} workouts={workouts} onUpdate={handleUpdate} onDelete={handleDelete} emptyStatus={emptyStatus} onAddClick={() => setShowAdd(true)} onLoadStarter={handleLoadStarter} />
        </div>
        <div style={{ display: tab === "Workouts" ? "block" : "none" }}>
          <WorkoutsTab exercises={shown} workouts={workouts} onSaveWorkout={handleSaveWorkout} onEditWorkout={handleEditWorkout} onDeleteWorkout={handleDeleteWorkout} />
        </div>
        <div style={{ display: tab === "Progress" ? "block" : "none" }}>
          <ProgressTab exercises={shown} workouts={workouts} />
        </div>
      </div>
      {showAdd && <AddExerciseSheet onAdd={handleAdd} onClose={() => setShowAdd(false)} existingNames={exercises.map(e => e.name)} />}
      {celebration && <Celebration pbs={celebration} onDone={() => setCelebration(null)} />}
    </div>
  );
}

// ─── Auth gate ───
function AuthGate({ onAuth }) {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [msg, setMsg] = useState("");

  const submit = async () => {
    setErr(""); setMsg("");
    if (!email.trim() || !password) { setErr("Enter your email and password."); return; }
    setBusy(true);
    try {
      if (mode === "signup") {
        const { data, error } = await supa.auth.signUp({ email: email.trim(), password });
        if (error) throw error;
        if (data.session) onAuth(data.session);
        else setMsg("Account created. Check your email to confirm, then sign in.");
      } else {
        const { data, error } = await supa.auth.signInWithPassword({ email: email.trim(), password });
        if (error) throw error;
        onAuth(data.session);
      }
    } catch (e) { setErr(e.message || "Something went wrong."); }
    setBusy(false);
  };

  return (
    <div style={{ background: "#0e0e10", minHeight: "100vh", fontFamily: "'Inter', system-ui, sans-serif", maxWidth: 480, margin: "0 auto", display: "flex", flexDirection: "column", justifyContent: "center", padding: "0 24px" }}>
      <div style={{ textAlign: "center", marginBottom: 28 }}>
        <div style={{ fontSize: 40, marginBottom: 10 }}>🏋️</div>
        <h1 style={{ color: "#f0f0f0", fontSize: 24, fontWeight: 700, margin: 0, letterSpacing: "-0.03em" }}>Gym Tracker</h1>
        <div style={{ color: "#666", fontSize: 13, marginTop: 4 }}>{mode === "signup" ? "Create your account" : "Sign in to your history"}</div>
      </div>
      <input type="email" inputMode="email" autoCapitalize="none" autoCorrect="off" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)}
        style={{ width: "100%", boxSizing: "border-box", background: "#1a1a1e", border: "1px solid #2a2a2e", borderRadius: 8, padding: "12px 14px", color: "#eee", fontSize: 15, outline: "none", fontFamily: "inherit", marginBottom: 10 }} />
      <input type="password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)}
        onKeyDown={e => { if (e.key === "Enter") submit(); }}
        style={{ width: "100%", boxSizing: "border-box", background: "#1a1a1e", border: "1px solid #2a2a2e", borderRadius: 8, padding: "12px 14px", color: "#eee", fontSize: 15, outline: "none", fontFamily: "inherit", marginBottom: 14 }} />
      {err && <div style={{ color: "#e5606a", fontSize: 13, marginBottom: 10 }}>{err}</div>}
      {msg && <div style={{ color: "#3AE89B", fontSize: 13, marginBottom: 10 }}>{msg}</div>}
      <button onClick={submit} disabled={busy}
        style={{ width: "100%", background: busy ? "#245" : "#3A9BE8", border: "none", borderRadius: 8, padding: "13px", color: "#fff", fontSize: 15, fontWeight: 600, cursor: busy ? "default" : "pointer", fontFamily: "inherit" }}>
        {busy ? "Please wait…" : (mode === "signup" ? "Create account" : "Sign in")}
      </button>
      <button onClick={() => { setMode(mode === "signup" ? "signin" : "signup"); setErr(""); setMsg(""); }}
        style={{ background: "none", border: "none", color: "#888", fontSize: 13, cursor: "pointer", fontFamily: "inherit", marginTop: 16, textAlign: "center" }}>
        {mode === "signup" ? "Already have an account? Sign in" : "New here? Create an account"}
      </button>
    </div>
  );
}

// ─── Config / splash ───
function CenterMsg({ children }) {
  return <div style={{ background: "#0e0e10", minHeight: "100vh", fontFamily: "'Inter', system-ui, sans-serif", display: "flex", alignItems: "center", justifyContent: "center", padding: "0 28px", textAlign: "center" }}>{children}</div>;
}

function Root() {
  const [session, setSession] = useState(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    if (!CONFIG_OK) { setReady(true); return; }
    supa.auth.getSession().then(({ data }) => {
      if (data.session) { currentUserId = data.session.user.id; setSession(data.session); }
      setReady(true);
    });
    const { data: sub } = supa.auth.onAuthStateChange((_e, s) => {
      currentUserId = s ? s.user.id : null;
      setSession(s);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  if (!CONFIG_OK) return <CenterMsg><div><div style={{ fontSize: 32, marginBottom: 12 }}>⚙️</div><div style={{ color: "#eee", fontSize: 16, fontWeight: 600, marginBottom: 8 }}>Almost there</div><div style={{ color: "#888", fontSize: 13, lineHeight: 1.6 }}>Open index.html and paste your Supabase project URL and anon key near the top, then reload.</div></div></CenterMsg>;
  if (!ready) return <CenterMsg><div style={{ color: "#555", fontSize: 14 }}>Loading…</div></CenterMsg>;
  if (!session) return <AuthGate onAuth={s => { currentUserId = s.user.id; setSession(s); }} />;
  return <MainApp key={session.user.id} onSignOut={async () => { cacheClear(); await supa.auth.signOut(); currentUserId = null; setSession(null); }} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
